<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC-PLAYER</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/bf46b31835.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="musicplayer">
            <nav>
                <div class="circle">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="circle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
            <img src="./Asserts/HD-wallpaper-alan-walker-blue-logo-norwegian-djs-blue-neon-lights-creative-blue-abstract-background-alan-olav-walker-alan-walker-logo-music-stars-alan-walker-thumbnail.jpg" class="song-img">
            <h1>On My Way</h1>
            <p>Allen Walker</p>

            <audio controls>
                <source src="./Asserts/On-My-Way(PagalNew.Com.Se).mp3" type="audio/mpeg">
            </audio>
            <input type="range" value="0" id="progress">

            <div class="controls">
                <div>
                    <i class="fa-solid fa-backward"></i>
                </div>
                <div>
                    <i class="fa-solid fa-play"></i>
                </div>
                <div>
                    <i class="fa-solid fa-forward"></i>
                </div>
            </div>
        </div>
    </div>
    
<script src="./index.js"></script>
</body>
</html>
